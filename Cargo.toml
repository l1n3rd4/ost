[package]
name = "teams-cli"
version = "0.1.0"
edition = "2021"
description = "Lightweight CLI client for Microsoft Teams"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client (use 0.11 for rustc 1.82 compatibility, native-tls avoids ICU issue)
reqwest = { version = "0.11", features = ["json", "native-tls"], default-features = false }

# JSON serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OAuth2 / Authentication
oauth2 = { version = "4", features = ["reqwest"] }
url = "2"
# Pin home to avoid 0.5.12 which requires edition 2024 (rustc 1.85+)
home = "=0.5.11"
# CLI
clap = { version = "4", features = ["derive"] }

# TUI (Ratatui)
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio-stream = "0.1"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config/storage
directories = "5"
toml = "0.8"

# Async utilities
futures = "0.3"
# Port traits (async trait methods) and stream types
async-trait = "0.1"
futures-core = "0.3"

# WebSocket (Trouter)
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
unicode-width = "0.2"

[features]
default = []

[dev-dependencies]
tokio-test = "0.4"
proptest = "1"
